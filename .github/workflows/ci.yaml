name: CI

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          # Keep in lockstep with GOLANGCI_LINT_VERSION in tools/golangci-lint.sh.
          version: v2.12.2
          args: --timeout=5m
      # golangci-lint's misspell linter covers Go sources; this covers the
      # Markdown docs with the same US locale.
      - name: Check spelling in Markdown
        run: git ls-files -z '*.md' | xargs -0 -r go run github.com/client9/misspell/cmd/misspell@v0.3.4 -locale US -error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go test -race -covermode=atomic ./...
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
